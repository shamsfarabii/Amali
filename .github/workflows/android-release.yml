name: Android APK Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: android-apk-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24.11.1"
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # Caches Gradle dependencies, wrapper and build cache between runs
      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Configure release signing
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            KEYSTORE_PATH="${RUNNER_TEMP}/release.keystore"
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
            {
              echo "EXPO_ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH"
              echo "EXPO_ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
              echo "EXPO_ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS"
              echo "EXPO_ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      # Settings are passed as flags: appending to the generated gradle.properties
      # (which has no trailing newline) corrupts its last line and breaks autolinking.
      - name: Build release APK
        working-directory: android
        run: |
          ./gradlew :app:assembleRelease \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g" \
            -PreactNativeArchitectures=arm64-v8a \
            -Pandroid.lint.checkReleaseBuilds=false \
            --build-cache
          cp app/build/outputs/apk/release/app-release.apk ../Munajat.apk

      - name: Prepare release
        id: release
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}-build.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          {
            echo "Automated Android APK built from \`main\` @ [\`${GITHUB_SHA}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA})."
            echo ""
            echo "Download **Munajat.apk** below and install on your device."
            echo ""
            if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
              echo "Signed with your upload keystore (GitHub Actions secrets)."
            else
              echo "Signed with the default debug keystore from \`expo prebuild\` (fine for personal sideloading). For a stable production key, add the \`ANDROID_KEYSTORE_*\` secrets — see README."
            fi
          } > release-notes.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: Munajat ${{ steps.release.outputs.version }} (build ${{ github.run_number }})
          body_path: release-notes.md
          files: Munajat.apk
          generate_release_notes: true
