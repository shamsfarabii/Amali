name: Android APK Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: android-apk-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CI: true

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.11.1"
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Configure release signing
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            KEYSTORE_PATH="${RUNNER_TEMP}/release.keystore"
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
            {
              echo "EXPO_ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH"
              echo "EXPO_ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
              echo "EXPO_ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS"
              echo "EXPO_ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: android
        run: ./gradlew :app:assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Package APK
        run: cp android/app/build/outputs/apk/release/app-release.apk Munajat.apk

      - name: Read app version
        id: app_version
        run: |
          VERSION=$(node -pe "require('./app.json').expo.version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}-build.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Write release notes
        run: |
          {
            echo "Automated Android APK built on GitHub Actions from \`main\` @ [\`${GITHUB_SHA}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA})."
            echo ""
            echo "Download **Munajat.apk** below and install on your device."
            echo ""
            if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
              echo "Signed with your upload keystore (GitHub Actions secrets)."
            else
              echo "Signed with the default debug keystore from \`expo prebuild\` (fine for personal sideloading). For a stable production key, add the \`ANDROID_KEYSTORE_*\` secrets — see README."
            fi
          } > release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.app_version.outputs.tag }}
          name: Munajat ${{ steps.app_version.outputs.version }} (build ${{ github.run_number }})
          body_path: release-notes.md
          files: Munajat.apk
          generate_release_notes: true
